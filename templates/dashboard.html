{% extends "base.html" %}{% block title %}Dashboard | Bean & Balance{% endblock %}
{% block content %}<div class="d-flex flex-wrap gap-3 justify-content-between align-items-center mb-4"><div><p class="text-uppercase small text-muted mb-1">Staff workspace</p><h1 class="h2 mb-0">Members</h1></div><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newMemberModal">+ New member</button></div>
<form id="searchForm" class="row g-2 mb-4"><div class="col-sm-7 col-md-5"><input id="search" class="form-control" placeholder="Search name or phone"></div><div class="col-sm-3"><select id="sort" class="form-select"><option value="created_at">Newest</option><option value="name">Name</option><option value="phone">Phone</option><option value="tier">Tier</option><option value="points">Balance</option></select></div><div class="col-sm-2"><button class="btn btn-outline-secondary w-100">Search</button></div></form>
<div class="table-responsive"><table class="table align-middle"><thead><tr><th>Member</th><th>Phone</th><th>Tier</th><th>Balance</th><th></th></tr></thead><tbody id="memberRows"><tr><td colspan="5">Loading...</td></tr></tbody></table></div><nav><ul id="pages" class="pagination"></ul></nav>
<div class="modal fade" id="newMemberModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><form id="newMemberForm"><div class="modal-header"><h2 class="modal-title h5">Add member</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="mb-3"><label class="form-label">Name</label><input class="form-control" name="name" required></div><div><label class="form-label">Phone</label><input class="form-control" name="phone" required></div><div id="newMemberError" class="text-danger mt-3"></div></div><div class="modal-footer"><button class="btn btn-primary">Create member</button></div></form></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script>
let page = 1;
async function loadMembers() { const params = new URLSearchParams({page, limit: 10, search: document.querySelector('#search').value, sort: document.querySelector('#sort').value, order: 'asc'}); const response = await fetch('/api/members?' + params); const data = await response.json(); const rows = document.querySelector('#memberRows'); rows.innerHTML = data.members.length ? data.members.map(m => `<tr><td><a class="fw-semibold text-decoration-none" href="/members/${m.id}">${m.name}</a></td><td>${m.phone}</td><td><span class="badge text-bg-warning">${m.tier}</span></td><td>${m.points_balance} pts</td><td><a class="btn btn-sm btn-outline-secondary" href="/members/${m.id}">Open</a></td></tr>`).join('') : '<tr><td colspan="5">No members found.</td></tr>'; document.querySelector('#pages').innerHTML = Array.from({length: data.pages}, (_, i) => `<li class="page-item ${i + 1 === page ? 'active' : ''}"><button class="page-link" onclick="page = ${i + 1}; loadMembers()">${i + 1}</button></li>`).join(''); }
document.querySelector('#searchForm').addEventListener('submit', e => { e.preventDefault(); page = 1; loadMembers(); }); document.querySelector('#newMemberForm').addEventListener('submit', async e => { e.preventDefault(); const response = await fetch('/api/members', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(Object.fromEntries(new FormData(e.target)))}); if (response.ok) { bootstrap.Modal.getInstance(document.querySelector('#newMemberModal')).hide(); e.target.reset(); loadMembers(); } else document.querySelector('#newMemberError').textContent = (await response.json()).error; }); loadMembers();
</script>{% endblock %}
